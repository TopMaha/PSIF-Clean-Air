# เว็บแอปเป็นไฟล์ static ล้วน — เผยแพร่ด้วยการมิเรอร์ main ไปยังสาขา gh-pages
# (GitHub Pages ของ repo นี้ตั้ง Source = สาขา gh-pages ซึ่งเปิดใช้อัตโนมัติตั้งแต่สาขานี้ถูกสร้าง)
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Mirror main -> gh-pages
        run: git push origin HEAD:gh-pages --force
